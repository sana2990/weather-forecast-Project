<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="weather.css">
    <script src="https://kit.fontawesome.com/05cc87699d.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="flex flex-row gap-2 m-3 p-2">
        <div class="flex flex-col">
            <div class="mt-3 pt-4">
                <button id="toggle_btn" class="border-2 rounded-2xl">toggle °C/°F</button>
            </div>
            <div class="mt-3 pt-4">
                <button>weather</button>
            </div>
            <div class="mt-3 pt-4">
                <button id="location" class="bord rounded-2xl">location</button>
            </div>
        </div>
        <div class="flex flex-1 box-border border-2 min-h-screen bg-amber-300 h- align-middle justify-around">
            <div class="border-2">
                <div>
                    <label class="m-2 p-1">City</label>
                    <input type="text" id="cityName" class="m-2 p-1 border border-black rounded-2xl" placeholder="enter city name">
                </div>
                <div id="saved_cities">
                    <label class="border-2 rounded-2xl  ">Cities: </label>
                    <select name="saved_cities_ddl" id="cities_ddl" class="border-2 rounded-2xl">
            
                    </select>
                </div>
            </div>
            <div class="flex flex-col flex-1 text-red-600">
                <div>
                    <p id="city" class="underline ">city ka naam </p>
                    <p id="temp">temperature</p>
                    <p id="feels_like">feels like: </p>
                </div>
                <div>
                    <!--<img id="weather_img" src="./images/rainy.png">-->
                </div>
            <div class="flex-1 border-2">
                <p>
                    <i class="fa-solid fa-wind"></i>
                </p>
                <p id="wind_speed"></p>
                <p id="deg">degree: </p>
            </div>
        </div>
        <div class="flex flex-col flex-1 bg-blue-300 border-2 rounded-2xl w-full">
            <p>5 day forecast</p>
            <div class="forecast flex flex-1 w-96 ">
                 
            </div>
        </div>
    </div>
    </div>
<div id="customPopUp" class="customPopUp">
    <div id="messageBox" class="messageBox">
        <p class="border-2">ERROR MESSAGE</p>
        <p id="popupMessagepara" class="font-semibold text-gray-600"></p>
        <button id="closePopup_btn" >OK</button>
    </div>
</div>
    <script src="./weather.js"></script>
</body>
</html>
